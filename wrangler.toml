name = "portal-os1"
main = "src/kernel/index.ts"
compatibility_date = "2026-04-01"

[vars]
ENVIRONMENT = "production"
MAX_PROCESS_HEAP_BYTES = 2097152 # 2MB Hard Cap

[[d1_databases]]
binding = "DB"
database_name = "portal-os1-production1-db"
database_id = "519881b7-d15c-46b6-9ec8-513c54beb30b"

[durable_objects]
bindings = [
  { name = "MICROKERNEL_ACTOR", class_name = "MicrokernelProcessActor" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MicrokernelProcessActor"]
