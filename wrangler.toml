name = "portal-os1-edge-kernel"
main = "src/kernel/index.ts"
compatibility_date = "2026-04-01"

[vars]
ENVIRONMENT = "production"
MAX_PROCESS_HEAP_BYTES = 2097152 # 2MB Hard Cap

[[d1_databases]]
binding = "DB"
database_name = "portal-os1-production-db"
database_id = "portal-os1-d1-uuid-placeholder"

[durable_objects]
bindings = [
  { name = "MICROKERNEL_ACTOR", class_name = "MicrokernelProcessActor" }
]

[[migrations]]
tag = "v1"
new_classes = ["MicrokernelProcessActor"]
